<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini gift</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;600&family=Dancing+Script:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Three.js (Import map for ES modules) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Phase 1: Intro UI Overlay -->
    <div id="intro-overlay" class="overlay">
        <div class="glass-card">
            <h1 class="title">Happy Birthday</h1>

            <div class="image-placeholder">
                <!-- Replace src with your actual bears GIF -->
                <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHplbG9rejl1ZXJ2MWl6YXUxYjFsbWprMnNoejk5MHRsZWpnNnA1MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kZqbBT64ECtjy/giphy.gif"
                    alt="Cute Bears GIF" class="bears-gif" onerror="this.src='photo1.jpg'">
            </div>

            <p class="subtitle">To my favorite person, happy birthday</p>

            <button id="btn-iniciar" class="glow-button">mini gift</button>
        </div>
    </div>

    <!-- Image Lightbox Modal -->
    <div id="image-modal" class="modal hidden">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content glass-card">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="modal-image-container">
                <img id="modal-image" src="" alt="Full size photo">
            </div>
        </div>
    </div>

    <!-- Audio Background -->
    <audio id="bgm" src="songs.mp3" loop></audio>

    <!-- Main JavaScript -->
    <script type="module" src="script.js"></script>
</body>

</html>
